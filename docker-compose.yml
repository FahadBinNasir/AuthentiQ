services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authentiq
      POSTGRES_USER: authentiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-authentiq-local-password}
    volumes:
      - authentiq-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentiq -d authentiq"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://authentiq:${POSTGRES_PASSWORD:-authentiq-local-password}@postgres:5432/authentiq
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-AuthentiQ}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  authentiq-postgres:
